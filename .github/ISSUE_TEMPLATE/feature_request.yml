name: Feature request
description: Suggest a student-focused feature or improvement.
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Good proposals explain the student problem first and keep the solution focused.
        For larger changes, discuss the idea before implementation.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap for a similar proposal.
          required: true
        - label: This proposal is focused on a real preparation or platform need.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult or missing for students today?
      placeholder: As a JEE aspirant, I need ... because ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the outcome you would like. Alternatives are welcome.
      placeholder: A clear description of the suggested behavior or experience.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any workaround or alternative you have considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant screenshots, examples, or constraints.
    validations:
      required: false
