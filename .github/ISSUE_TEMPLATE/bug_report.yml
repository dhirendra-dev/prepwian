name: Bug report
description: Report a reproducible problem in JEE Prep Hub.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Please search existing issues first. For security vulnerabilities, do not use
        this public form; follow the private reporting instructions in SECURITY.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and could not find this report.
          required: true
        - label: This report does not contain secrets or private user information.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue clearly and include the affected page or feature.
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser or environment
      description: Select the closest match, or describe it in the additional details field.
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Mobile browser
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or additional context
      description: Remove tokens, personal information, and other sensitive data before sharing.
      render: shell
    validations:
      required: false
