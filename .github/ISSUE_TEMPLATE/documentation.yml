name: Documentation improvement
description: Report unclear, incorrect, or missing project documentation.
title: "docs: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: >-
        Please search existing issues first. Do not include credentials, private user data,
        or confidential configuration values.
  - type: textarea
    id: location
    attributes:
      label: Documentation location
      description: Link the file or section, if known.
      placeholder: README.md, CONTRIBUTING.md, or a relevant setup section.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should be corrected or added?
      description: Explain what is unclear, inaccurate, or missing.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: If you have one, describe the wording or information that would help.
    validations:
      required: false
